name = "ekhtyaraty"
main = "worker.js"
compatibility_date = "2026-07-03"

# ملحوظة مهمة عن تغيير الاسم: تغيير "name" ده بيخلي Cloudflare يتعامل مع المشروع كـ Worker
# جديد باسم مختلف عند أول رفع (wrangler deploy / أول Deploy من الداشبورد بعد الرفع)، مش مجرد
# إعادة تسمية للموجود. الـ KV والـ R2 والـ Secrets (كلمة سر لوحة التحكم) هتفضل شغالة زي ما هي
# لأنها مربوطة بالـ IDs بتاعتها هنا مش باسم المشروع. لو عندك دومين مخصص (Custom Domain) مربوط
# بالـ Worker القديم "aktyaraty"، هتحتاج تعيد ربطه بالـ Worker الجديد "ekhtyaraty" من
# Workers & Pages -> ekhtyaraty -> Settings -> Domains & Routes بعد أول رفع.

kv_namespaces = [
  { binding = "STORE_KV", id = "0fdabb9050184676ac74e58fc8e60fd4" }
]

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/api/*"]

# ===== Cloudflare Images binding - لازم عشان تحويل صور المشاركة (1200×630) وصور الكارت (800×800) يشتغل =====
# ملحوظة: خدمة Cloudflare Images منتج له تكلفة حسب الاستخدام (usage-based)، لازم تفعّله من الداشبورد
# (Images -> Enable) قبل ما الـ binding ده يشتغل، وإلا الكود هيرجع للصورة الأصلية زي ما هي تلقائيًا (fallback آمن)
[images]
binding = "IMAGES"

# ===== R2 Bucket لتخزين صور المتجر (بديل عن الروابط الخارجية) =====
# لازم تنشئ الـ bucket ده من الداشبورد أولاً (R2 -> Create bucket -> اسمه "karystore-images")
[[r2_buckets]]
binding = "STORE_IMAGES"
bucket_name = "karystore-images"

# ===== D1 Database لعداد الزيارات (عدد فتحات الصفحة الرئيسية وصفحات المنتجات كل يوم) =====
# ✅ اتعمل الربط بنجاح - الداتابيز اسمها "ekhtyaratyvisits" والـ ID بتاعها متسجل تحت.
# الجدول نفسه (visits_daily) بيتعمل تلقائيًا أول ما حد يفتح الموقع بعد الرفع، مش محتاج SQL يدوي.
[[d1_databases]]
binding = "VISITS_DB"
database_name = "ekhtyaratyvisits"
database_id = "a5f4fc50-bc1f-49ac-b74d-71fa34aeba64"

# لوحة التحكم بتستخدم نظام دخول بخطوتين (كلمتين سر منفصلتين)، فلازم تضيف الاتنين كـ Secrets
# من Settings -> Variables and secrets في الداشبورد: ADMIN_HASH (كلمة السر الأولى) و ADMIN_HASH2 (كلمة السر الثانية)
# - من غير الاتنين مع بعض، تسجيل الدخول للوحة التحكم مش هيشتغل خالص.
# - دول Secrets مربوطين بالمشروع نفسه (مش بالاسم)، فمش هيتأثروا بتغيير "name" فوق - هيفضلوا شغالين زي ما هما.
